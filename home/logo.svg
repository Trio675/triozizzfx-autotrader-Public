<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ee6b0"/><stop offset=".5" stop-color="#3b82f6"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="gz" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cffd0"/><stop offset=".45" stop-color="#4f8dff"/><stop offset="1" stop-color="#c47bff"/>
    </linearGradient>
    <radialGradient id="bg" cx=".3" cy=".2" r="1.1">
      <stop offset="0" stop-color="#1d2a55"/><stop offset=".55" stop-color="#0e1530"/><stop offset="1" stop-color="#060a18"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".55" r=".55">
      <stop offset="0" stop-color="#3b82f6" stop-opacity=".35"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect x="16" y="16" width="480" height="480" rx="116"/></clipPath>
  </defs>
  <!-- body -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bg)"/>
  <g clip-path="url(#clip)">
    <circle cx="256" cy="290" r="230" fill="url(#halo)"/>
    <!-- faint chart grid -->
    <g stroke="#ffffff" stroke-opacity=".05" stroke-width="2"><path d="M16 176H496M16 256H496M16 336H496M16 416H496"/></g>
    <!-- gloss -->
    <path d="M16 16H496V196C380 236 150 236 16 176Z" fill="url(#gloss)"/>
  </g>
  <!-- shiny gradient rim -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="none" stroke="url(#g)" stroke-width="14"/>
  <rect x="30" y="30" width="452" height="452" rx="104" fill="none" stroke="#fff" stroke-opacity=".10" stroke-width="3"/>
  <!-- trio dots -->
  <g filter="url(#soft)">
    <circle cx="164" cy="128" r="24" fill="#2ee6b0"/><circle cx="256" cy="128" r="24" fill="#3b82f6"/><circle cx="348" cy="128" r="24" fill="#a855f7"/>
  </g>
  <g fill="#fff" fill-opacity=".55"><circle cx="157" cy="120" r="7"/><circle cx="249" cy="120" r="7"/><circle cx="341" cy="120" r="7"/></g>
  <!-- glowing Z -->
  <path d="M124 214H372L146 388H392" fill="none" stroke="url(#gz)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M124 214H372L146 388H392" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" transform="translate(-3,-9)"/>
  <!-- up arrow -->
  <g filter="url(#soft)" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M318 290L392 216"/><path d="M340 214H394V268"/>
  </g>
  <!-- sparkle -->
  <path d="M420 80l7 19 19 7-19 7-7 19-7-19-19-7 19-7z" fill="#fff" opacity=".9"/>
</svg>
