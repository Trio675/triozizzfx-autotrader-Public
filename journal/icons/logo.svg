<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2431"/>
      <stop offset="1" stop-color="#0b0e13"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#d9822b"/>
      <stop offset="1" stop-color="#ffc35c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="108" fill="none" stroke="#f0a63a" stroke-opacity=".22" stroke-width="4"/>
  <!-- three rising candles: the "trio" -->
  <g stroke-linecap="round">
    <line x1="160" y1="232" x2="160" y2="392" stroke="#7d6440" stroke-width="12"/>
    <rect x="128" y="270" width="64" height="96" rx="10" fill="#7d6440"/>
    <line x1="256" y1="168" x2="256" y2="360" stroke="#c4862f" stroke-width="12"/>
    <rect x="224" y="204" width="64" height="122" rx="10" fill="#c4862f"/>
    <line x1="352" y1="96" x2="352" y2="300" stroke="url(#gold)" stroke-width="12"/>
    <rect x="320" y="128" width="64" height="142" rx="10" fill="url(#gold)"/>
  </g>
  <!-- ledger baseline -->
  <rect x="112" y="414" width="288" height="14" rx="7" fill="#f0a63a" fill-opacity=".9"/>
</svg>
