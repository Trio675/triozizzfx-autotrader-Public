<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1015">
<meta name="description" content="Private trading journal for forex, synthetic indices, gold and crypto: log trades, track returns, and size positions.">
<title>Triozizz Journal</title>
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="gate" id="gate"><div class="gatebox" id="gatebox"><p class="sub">Loading…</p></div></div>

<div class="app" id="app" hidden>
  <nav class="rail" aria-label="Journal sections">
    <div class="brand"><img src="icons/logo.svg" alt="" width="36" height="36"><span>TRIOZIZZ<small>Journal</small></span></div>
    <label class="acctsel"><span>Account</span><select class="input" id="acctFilter" aria-label="Trading account"></select></label>
    <button class="tab" data-view="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg><span>Dashboard</span></button>
    <button class="tab" data-view="returns"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V14M9 20V8M14 20V11M19 20V4"/></svg><span>Returns</span></button>
    <button class="tab" data-view="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Calendar</span></button>
    <button class="tab" data-view="trades"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Trades</span></button>
    <button class="tab" data-view="tools"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8M8 11h2M14 11h2M8 15h2M14 15h2M8 19h2M14 19h2"/></svg><span>Calculators</span></button>
    <button class="tab desk" data-view="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg><span>Plan</span></button>
    <button class="tab desk" data-view="setup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span>Setup</span></button>
    <button class="tab mob" id="moreBtn" aria-haspopup="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg><span>More</span></button>
    <button class="btn primary add" id="railAdd">+ Log trade</button>
    <button class="btn ghost lockr" data-act="lock">Lock</button>
    <div class="sync" id="sync"></div>
  </nav>
  <main id="main"></main>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheetbox" role="menu">
    <div class="acctsel"><span>Account</span><select class="input" id="acctFilterM" aria-label="Trading account"></select></div>
    <button class="sheetitem" data-go="plan">Plan &amp; weekly review</button>
    <button class="sheetitem" data-go="setup">Setup, security &amp; backup</button>
    <button class="sheetitem" data-act="lock">Lock journal</button>
    <button class="sheetitem" data-act="close-sheet">Close</button>
  </div>
</div>
<button class="fab" id="fab" aria-label="Log a trade" hidden>+</button>

<div class="overlay" id="ov" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <form class="modal" id="tradeForm" novalidate>
    <div class="mh"><h2 id="mTitle">Log trade</h2><button type="button" class="btn ghost sm" id="mClose">Close</button></div>
    <div class="form">
      <div class="f"><label for="fDate">Date</label><input class="input" type="date" id="fDate" required></div>
      <div class="f"><label for="fTime">Time</label><input class="input" type="time" id="fTime"></div>
      <div class="f"><label for="fSym">Symbol</label><input class="input" id="fSym" list="symList" placeholder="EURUSD" autocomplete="off"></div>
      <div class="f"><label for="fMarket">Market</label><select class="input" id="fMarket"><option>Forex</option><option>Synthetic</option><option>Metals</option><option>Crypto</option><option>Indices</option><option>Stocks</option></select></div>
      <div class="f"><label for="fDir">Direction</label><select class="input" id="fDir"><option>Buy</option><option>Sell</option></select></div>
      <div class="f"><label for="fAcct">Trading account</label><select class="input" id="fAcct"></select></div>
      <div class="f"><label for="fSrc">Taken by</label><select class="input" id="fSrc"></select></div>
      <div class="f"><label for="fSetup">Setup</label><input class="input" id="fSetup" list="setupList" placeholder="Trend pullback" autocomplete="off"></div>
      <div class="f"><label for="fSession">Session</label><select class="input" id="fSession"><option>Asian</option><option>London</option><option>New York</option><option>London/NY overlap</option><option>24/7 (synthetic)</option></select></div>
      <div class="f"><label for="fEntry">Entry</label><input class="input num" id="fEntry" inputmode="decimal"></div>
      <div class="f"><label for="fSL">Stop loss</label><input class="input num" id="fSL" inputmode="decimal"></div>
      <div class="f"><label for="fTP">Take profit</label><input class="input num" id="fTP" inputmode="decimal"></div>
      <div class="f"><label for="fExit">Exit</label><input class="input num" id="fExit" inputmode="decimal"></div>
      <div class="f"><label for="fLots">Lot size</label><input class="input num" id="fLots" inputmode="decimal"></div>
      <div class="f"><label for="fRisk" id="fRiskL">Risked</label><input class="input num" id="fRisk" inputmode="decimal" placeholder="1.00"></div>
      <div class="f"><label for="fPnl" id="fPnlL">Net P&amp;L</label><input class="input num" id="fPnl" inputmode="decimal" placeholder="-1.00 or 2.40" required></div>
      <div class="f"><label for="fGrade">Setup grade</label><select class="input" id="fGrade"><option>A</option><option selected>B</option><option>C</option></select></div>
      <div class="f full preview" id="fPreview"></div>
      <div class="f"><label for="fEmo">Mindset</label><select class="input" id="fEmo"><option>Calm</option><option>Confident</option><option>Hesitant</option><option>FOMO</option><option>Revenge</option><option>Tired</option></select></div>
      <div class="f"><label for="fPlan">Followed my plan?</label><select class="input" id="fPlan"><option value="1">Yes</option><option value="0">No</option></select></div>
      <div class="f full"><label>Mistakes</label><div class="chips" id="fMistakes"></div></div>
      <div class="f full"><label for="fNotes">Notes: why I entered, how I managed it, lesson</label><textarea class="input" id="fNotes"></textarea></div>
      <div class="f full"><label for="fShot">Chart screenshot</label>
        <div class="shotrow"><label class="btn sm" for="fShot" tabindex="0">Choose image</label><input type="file" id="fShot" accept="image/*" hidden><button type="button" class="btn sm ghost" id="fShotClear" hidden>Remove</button><span class="sub" id="fShotName"></span></div>
        <img id="fShotImg" class="shot" alt="Chart screenshot for this trade" hidden></div>
      <div class="f full"><label for="fLink">Or a chart link</label><input class="input" id="fLink" placeholder="https://www.tradingview.com/x/…"></div>
    </div>
    <div class="err" id="fErr" role="alert"></div>
    <div class="mf"><button type="button" class="btn danger" id="fDel">Delete trade</button><span style="flex:1"></span><button type="button" class="btn" id="fCancel">Cancel</button><button type="submit" class="btn primary" id="fSave">Save trade</button></div>
  </form>
</div>
<div class="overlay" id="cov" role="dialog" aria-modal="true" aria-labelledby="cTitle">
  <div class="modal" style="width:min(420px,100%)"><h2 id="cTitle" style="margin:0 0 8px">Are you sure?</h2><p id="cMsg" class="sub" style="font-size:14px"></p><div class="mf"><span></span><span class="inline"><button class="btn" id="cNo">Cancel</button><button class="btn danger" id="cYes">Delete</button></span></div></div>
</div>
<div class="toast" id="toast" role="status"></div>
<datalist id="symList"></datalist><datalist id="setupList"></datalist>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
