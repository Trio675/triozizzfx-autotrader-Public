# Static site: no build step. Netlify serves the files as they are.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Always fetch the latest app so users get updates straight away
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
